<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#14111f" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23ff2e88'/%3E%3C/svg%3E" />
    <title>Buzzer</title>
  </head>
  <body class="player">
    <main>
      <section id="join" class="card" hidden>
        <h1>Buzzer</h1>
        <form id="join-form">
          <label>
            Room code
            <input id="code" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="24" required />
          </label>
          <label>
            Your name
            <input id="name" autocomplete="nickname" maxlength="24" required />
          </label>
          <button type="submit">Join</button>
          <p id="join-error" class="error" role="alert"></p>
        </form>
      </section>

      <section id="game" hidden>
        <header class="bar">
          <span id="me"></span>
          <span id="score" class="score"></span>
        </header>
        <button id="buzz" class="buzz" type="button">Buzz</button>
        <p id="message" class="message" aria-live="polite"></p>
        <footer class="bar muted">
          <span>Room <strong id="room"></strong></span>
          <button id="leave" class="link" type="button">Leave</button>
        </footer>
      </section>
    </main>
    <p id="connection" class="connection" hidden></p>
    <script type="module" src="/src/player.ts"></script>
  </body>
</html>
